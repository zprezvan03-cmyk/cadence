name: Build Linux packages

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage number used in the artifact name (Cadence-<stage>-linux)"
        required: false
        default: "7"
  push:
    branches: [feat/ui]
    paths:
      - .github/stage-build.txt
      - .github/workflows/build-linux.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STAGE_INPUT: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine stage
        run: |
          stage="$STAGE_INPUT"
          if [ -z "$stage" ]; then
            stage="$(tr -d '[:space:]' < .github/stage-build.txt)"
          fi
          echo "STAGE=$stage" >> "$GITHUB_ENV"
          echo "Building Cadence-$stage for Linux"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build AppImage and deb
        run: npm run package:linux

      - name: Write checksums
        run: |
          cd src-tauri/target/release/bundle
          sha256sum appimage/*.AppImage deb/*.deb ../cadence > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-${{ env.STAGE }}-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/SHA256SUMS
            src-tauri/target/release/cadence
          if-no-files-found: error
