name: Publish v1.1.0 beta release

on:
  push:
    branches:
      - arena/45c1b4bd-cadence
    paths:
      - .github/release-trigger.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard against duplicate publish
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.1.0 --json isDraft --jq '.isDraft' 2>/dev/null | grep -q 'false'; then
            echo "v1.1.0 is already published; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble Windows release assets
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p src-tauri/target/release .artifacts/release/assets
          unzip -o stage-build/Cadence-1.1.0.zip -d .artifacts/release/extracted
          cp .artifacts/release/extracted/Cadence-1.1.0.exe src-tauri/target/release/Cadence.exe
          node scripts/make-windows-portable.mjs
          cp release/Cadence-1.1.0-win-x64-portable.zip .artifacts/release/assets/
          cp .artifacts/release/extracted/Cadence-1.1.0.exe .artifacts/release/assets/Cadence-1.1.0-win-x64.exe
          cd .artifacts/release/assets
          sha256sum Cadence-1.1.0-win-x64-portable.zip Cadence-1.1.0-win-x64.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Remove any leftover draft release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete v1.1.0 --yes || true

      - name: Publish prerelease with assets
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.1.0 \
            --target main \
            --title "v1.1.0 (Beta)" \
            --prerelease \
            --notes-file .github/release-notes-v1.1.0.md \
            .artifacts/release/assets/Cadence-1.1.0-win-x64-portable.zip \
            .artifacts/release/assets/Cadence-1.1.0-win-x64.exe \
            .artifacts/release/assets/SHA256SUMS.txt
