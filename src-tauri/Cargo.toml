[package]
name = "cadence"
version = "0.1.0"
description = "Cadence — Desktop music player with synchronized, animated lyrics"
authors = ["Cadence Contributors"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cadence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-opener = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
percent-encoding = "2.3"
url = "2.5"
tokio = { version = "1", features = ["sync", "time", "rt"] }
reqwest = { version = "0.12", features = ["gzip"] }
rusqlite = { version = "0.38", features = ["bundled"] }
rfd = "0.16"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
