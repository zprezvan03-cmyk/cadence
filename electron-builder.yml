appId: app.cadence.player
productName: Cadence
copyright: Copyright © 2026 Cadence contributors — GPL-3.0

directories:
  output: release
  buildResources: build

# Only the compiled output and the runtime dependencies the main process actually needs.
files:
  - out/**/*
  - package.json
  - "!**/*.map"

asar: true
asarUnpack:
  - resources/**

extraMetadata:
  main: out/main/index.js

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Unsigned build: Windows SmartScreen will warn on first run. See README "Installing".
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Cadence

linux:
  target:
    - AppImage
  category: AudioVideo
  synopsis: Local music player with word-level lyrics and shader artwork backgrounds

mac:
  target:
    - dmg
  category: public.app-category.music

# Note on codecs: Cadence decodes audio through Chromium's bundled media stack, which ships with
# Electron. No external ffmpeg binary is bundled or downloaded at build time.
